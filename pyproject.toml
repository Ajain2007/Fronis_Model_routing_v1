[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fronis-router"
version = "0.1.0"
description = "KNN and SetFit powered query-to-model router"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "boto3>=1.35",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    # This tested group matches the exported SetFit artifact. Pinning it avoids
    # pip mixing an older Transformers release with a newer SentenceTransformers.
    "sentence-transformers==6.0.1",
    "setfit==1.2.0",
    "transformers==5.16.1",
    "huggingface-hub==1.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]
